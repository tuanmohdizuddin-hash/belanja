<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Perbelanjaan — Belanja</title>
<meta name="theme-color" content="#0b0c10">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16171c; --ink2:#3a3d47; --muted:#6b6f7a; --faint:#9a9ea8; --line:#e6e3da; --line2:#f0ede5;
  --paper:#ffffff; --cream:#faf8f2;
  --gold:#b8922a; --gold-l:#d4af37; --gold-xl:#f3e6b8; --silver:#8b8f99; --silver-l:#d9dce2;
  --g-gold:linear-gradient(135deg,#f6e7a6 0%,#d4af37 38%,#a8841f 62%,#f0d77d 100%);
  --g-silver:linear-gradient(135deg,#ffffff 0%,#c9ccd3 40%,#8b8f99 65%,#e9ebef 100%);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0b0c10;background-image:radial-gradient(900px 500px at 85% -10%,rgba(212,175,55,.13),transparent 60%);
  font-family:'Outfit',system-ui,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:12px 16px;background:rgba(11,12,16,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
.toolbar .l{display:flex;gap:10px;align-items:center;color:#ecebe6;font-size:14px}
.toolbar .r{display:flex;gap:8px;flex-wrap:wrap}
.tb{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#c9ccd3;font:inherit;font-size:14px;padding:9px 14px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tb.gold{background:var(--g-gold);color:#1b1608;border:0;font-weight:600}
.tb select,.tb input{background:none;border:0;color:inherit;font:inherit;outline:0}
.tb select option{color:#111}

/* paper */
.stage{padding:28px 16px 60px}
.paper{max-width:820px;margin:0 auto;background:var(--paper);border-radius:6px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);overflow:hidden}
.pad{padding:0 48px}

/* cover band */
.band{position:relative;background:#101116;color:#ecebe6;padding:40px 48px 34px;overflow:hidden}
.band::before{content:"";position:absolute;right:-120px;top:-160px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.28),transparent 65%)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--g-gold)}
.band-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;position:relative}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--g-gold);display:grid;place-items:center}
.logo svg{width:21px;height:21px}
.brand b{display:block;font-size:22px;font-weight:600;letter-spacing:.5px}
.brand small{display:block;font-size:10px;letter-spacing:2.5px;color:#9a9ca6;text-transform:uppercase;margin-top:2px}
.ref{text-align:right;font-size:11px;color:#9a9ca6;letter-spacing:1px;line-height:1.7}
.ref b{color:#e8d9a8;font-weight:500}
.title{position:relative;margin-top:34px}
.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#e8d9a8}
.title h1{margin:8px 0 0;font-size:44px;line-height:1.05;font-weight:600;
  background:var(--g-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}
.meta span{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8b8f99}
.meta b{display:block;margin-top:5px;font-size:15px;font-weight:500;color:#f4f5f7}
.meta .name b{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:#f3dc8a;line-height:1.1}

/* sections */
section{padding-top:30px}
h2{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink2)}
h2 .n{width:24px;height:24px;border-radius:7px;background:var(--g-gold);color:#1b1608;display:grid;place-items:center;font-size:11px;letter-spacing:0}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--cream);position:relative;overflow:hidden}
.kpi:first-child{background:#101116;border-color:#101116}
.kpi:first-child span{color:#9a9ca6}.kpi:first-child b{background:var(--g-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi:first-child em{color:#c9ccd3}
.kpi span{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;margin-top:6px;font-size:21px;font-weight:600;white-space:nowrap}
.kpi em{display:block;margin-top:4px;font-style:normal;font-size:11px;color:var(--muted)}
.up{color:#b5543f}.down{color:#3f8a5a}
.summary{margin-top:16px;padding:16px 18px;border-left:3px solid var(--gold-l);background:linear-gradient(90deg,#fbf6e6,#fff);border-radius:0 12px 12px 0;
  font-size:14px;line-height:1.7;color:var(--ink2)}
.summary b{color:var(--ink)}
.prog{margin-top:14px}
.prog .bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--g-gold);border-radius:99px}
.prog .bar.over i{background:linear-gradient(90deg,#e8a87c,#c9584a)}
.prog .row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}

.two{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:8px 8px;border-bottom:1.5px solid var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.r{text-align:right}.c{text-align:center}
tbody tr:nth-child(even) td{background:#fcfbf7}
tfoot td{font-weight:600;border-top:1.5px solid var(--ink);border-bottom:0;padding-top:11px}
tfoot .tot{font-size:15px;color:var(--gold)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:0}
.mini{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;min-width:60px}
.mini i{display:block;height:100%;border-radius:99px}
.cat-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.muted{color:var(--muted)}
.day-row td{background:#f6f3ea !important;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:6px 8px}
.top5 .rank{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;background:var(--line2);color:var(--ink2)}
.top5 tr:first-child .rank{background:var(--g-gold);color:#1b1608}
.top5 tr:nth-child(2) .rank,.top5 tr:nth-child(3) .rank{background:var(--g-silver);color:#1b1c22}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--ink2);display:flex;gap:10px}
.note i{font-style:normal;font-size:16px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:10px}
.sign div{padding-top:44px;border-bottom:1px solid var(--ink);position:relative}
.sign div span{position:absolute;bottom:-34px;left:0;font-size:11px;color:var(--muted);line-height:1.5}
.sign div span b{display:block;color:var(--ink);font-size:13px;font-weight:600}
.foot{margin-top:64px;padding:16px 48px;background:var(--cream);border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:var(--faint)}
.empty{padding:40px 48px;text-align:center;color:var(--muted)}
svg text{font-family:'Outfit',sans-serif}

@media (max-width:700px){
  .pad{padding:0 20px}.band{padding:28px 20px 26px}.foot{padding:14px 20px}
  .title h1{font-size:32px}
  .meta{grid-template-columns:1fr 1fr}.meta .name{grid-column:span 2}
  .kpis{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}.two svg{margin:0 auto;display:block}
  .notes{grid-template-columns:1fr}
  .hide-sm{display:none}
  table{font-size:12px}
}
@page{size:A4;margin:12mm 0 14mm}
@page:first{margin-top:0}
@media print{
  body{background:#fff}
  .toolbar{display:none}
  .stage{padding:0}
  .paper{max-width:none;box-shadow:none;border-radius:0}
  section{break-inside:avoid-page}
  section.long{break-inside:auto}
  tr{break-inside:avoid}
  thead{display:table-header-group}
  tfoot{display:table-row-group}
}
</style>
</head>
<body>
<div class="toolbar">
  <div class="l"><a class="tb" href="./">← Dashboard</a></div>
  <div class="r">
    <label class="tb">👤 <input id="nm" placeholder="Nama anda" style="width:130px"></label>
    <label class="tb">📅 <select id="period"></select></label>
    <button class="tb gold" id="print">⬇ Cetak / Simpan PDF</button>
  </div>
</div>

<div class="stage"><article class="paper" id="paper"></article></div>

<script>
(() => {
'use strict';
const KEY = 'belanja.v1';
let state; try { state = JSON.parse(localStorage.getItem(KEY)) || {tx:[],budget:0,name:''}; } catch { state = {tx:[],budget:0,name:''}; }
const saveState = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const CATS = {
  makanan:{n:'Makanan & Minuman',e:'🍽',c:'#d4af37'}, transport:{n:'Pengangkutan',e:'🚗',c:'#9aa0ab'},
  bil:{n:'Bil & Utiliti',e:'💡',c:'#b08d57'}, barang:{n:'Barang Dapur',e:'🛒',c:'#e0cc8f'},
  shopping:{n:'Shopping',e:'🛍',c:'#b76e79'}, hiburan:{n:'Hiburan',e:'🎬',c:'#6f7a90'},
  kesihatan:{n:'Kesihatan',e:'💊',c:'#7fae98'}, lain:{n:'Lain-lain',e:'✦',c:'#5a5e69'}
};
const cat = id => CATS[id] || CATS.lain;
const BULAN = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const HARI = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const RM = n => 'RM ' + fmt(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dstr = d => `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
const dshort = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
const D = 864e5;

/* ---------- period options ---------- */
const now = new Date();
const opts = [];
for (let i = 0; i < 12; i++){
  const s = new Date(now.getFullYear(), now.getMonth()-i, 1), e = new Date(now.getFullYear(), now.getMonth()-i+1, 1);
  opts.push({v:'m'+i, label: (i===0?'Bulan ini · ':i===1?'Bulan lepas · ':'') + BULAN[s.getMonth()] + ' ' + s.getFullYear(), s, e, months:1, title:'Laporan Bulanan'});
}
const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
opts.splice(2,0,
  {v:'d7', label:'7 hari terakhir', s:new Date(t0-7*D), e:t0, months:7/30.44, title:'Laporan Mingguan'},
  {v:'d30', label:'30 hari terakhir', s:new Date(t0-30*D), e:t0, months:30/30.44, title:'Laporan 30 Hari'},
  {v:'q', label:'3 bulan terakhir', s:new Date(now.getFullYear(), now.getMonth()-2, 1), e:new Date(now.getFullYear(), now.getMonth()+1, 1), months:3, title:'Laporan Suku Tahun'},
  {v:'y', label:'Tahun ' + now.getFullYear(), s:new Date(now.getFullYear(),0,1), e:new Date(now.getFullYear()+1,0,1), months:12, title:'Laporan Tahunan'});
const qs = new URLSearchParams(location.search);
$('#period').innerHTML = opts.map(o => `<option value="${o.v}">${o.label}</option>`).join('');
$('#period').value = opts.some(o=>o.v===qs.get('p')) ? qs.get('p') : 'm0';
$('#nm').value = qs.get('nama') || state.name || '';

/* ---------- build ---------- */
function build(){
  const o = opts.find(x => x.v === $('#period').value);
  const name = $('#nm').value.trim();
  const S = o.s.getTime(), E = o.e.getTime();
  const lastDay = new Date(Math.min(E, t0.getTime()) - 1);  // don't count future days
  const tx = state.tx.filter(t => t.ts >= S && t.ts < E).sort((a,b) => a.ts - b.ts);
  const total = tx.reduce((s,t)=>s+t.amount, 0);
  const nDays = Math.max(1, Math.round((startOf(lastDay) - S)/D) + 1);
  const avg = total / nDays;
  const len = E - S;
  const prev = state.tx.filter(t => t.ts >= S - len && t.ts < S).reduce((s,t)=>s+t.amount,0);
  const delta = prev ? (total - prev)/prev*100 : null;
  const budget = (+state.budget || 0) * o.months;
  const pctB = budget ? total/budget*100 : 0;
  const ref = 'BLJ-' + o.s.getFullYear() + String(o.s.getMonth()+1).padStart(2,'0') + '-' + String(tx.length).padStart(3,'0') + Math.round(total*100 % 1000);

  // by category
  const by = {};
  tx.forEach(t => { const k = CATS[t.cat] ? t.cat : 'lain'; (by[k] ||= {v:0,n:0}); by[k].v += t.amount; by[k].n++; });
  const cats = Object.entries(by).sort((a,b)=>b[1].v-a[1].v);
  // by day
  const days = []; for (let t = S; t <= startOf(lastDay); t += D) days.push({d:new Date(t), v:0});
  tx.forEach(t => { const i = Math.floor((startOf(new Date(t.ts)) - S)/D); if (days[i]) days[i].v += t.amount; });
  const activeDays = days.filter(d=>d.v>0).length;
  const peak = days.reduce((m,d)=> d.v>m.v?d:m, {v:0});
  const top5 = [...tx].sort((a,b)=>b.amount-a.amount).slice(0,5);
  const dow = Array(7).fill(0); tx.forEach(t => dow[new Date(t.ts).getDay()] += t.amount);
  const wkend = dow[0]+dow[6];

  document.title = `Laporan Perbelanjaan — ${name || 'Belanja'} — ${o.label.replace(/^.*· /,'')}`;
  const periodTxt = `${dstr(o.s)} – ${dstr(new Date(E-1))}`;

  let h = `
  <header class="band">
    <div class="band-top">
      <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1b1608" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7z"/><path d="M3 7l12-3v3"/><circle cx="16.5" cy="13.5" r="1.4" fill="#1b1608"/></svg></div>
        <div><b class="serif">Belanja</b><small>Penjejak Perbelanjaan Peribadi</small></div></div>
      <div class="ref">No. Rujukan<br><b>${ref}</b><br>Dijana ${dshort(now)}, ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</div>
    </div>
    <div class="title"><div class="eyebrow">${o.title}</div><h1 class="serif">Laporan Perbelanjaan</h1></div>
    <div class="meta">
      <div class="name"><span>Disediakan untuk</span><b>${esc(name || '—')}</b></div>
      <div><span>Tempoh</span><b>${periodTxt}</b></div>
      <div><span>Mata wang</span><b>Ringgit Malaysia (RM)</b></div>
    </div>
  </header>`;

  if (!tx.length){
    h += `<div class="empty"><div class="serif" style="font-size:26px;color:var(--ink)">Tiada transaksi</div><p>Tiada perbelanjaan direkodkan bagi tempoh ${periodTxt}. Pilih tempoh lain di atas.</p></div>` + footer(name, ref);
    $('#paper').innerHTML = h; return;
  }

  // 1. Ringkasan
  const topCat = cats[0];
  h += `<div class="pad"><section><h2><span class="n">1</span>Ringkasan Eksekutif</h2>
    <div class="kpis">
      <div class="kpi"><span>Jumlah Belanja</span><b>${RM(total)}</b><em>${tx.length} transaksi</em></div>
      <div class="kpi"><span>Purata Sehari</span><b>${RM(avg)}</b><em>${nDays} hari dikira</em></div>
      <div class="kpi"><span>Berbanding Tempoh Lepas</span><b class="${delta==null?'':delta>0?'up':'down'}">${delta==null?'—':(delta>0?'▲ ':'▼ ')+Math.abs(delta).toFixed(1)+'%'}</b><em>${prev?RM(prev):'Tiada data'}</em></div>
      <div class="kpi"><span>Penggunaan Bajet</span><b class="${pctB>100?'up':''}">${budget?pctB.toFixed(0)+'%':'—'}</b><em>${budget?'daripada '+RM(budget):'Bajet tidak ditetapkan'}</em></div>
    </div>
    ${budget ? `<div class="prog"><div class="bar ${pctB>100?'over':''}"><i style="width:${Math.min(100,pctB)}%"></i></div>
      <div class="row"><span>Digunakan ${RM(total)}</span><span>${total>budget?'Melebihi '+RM(total-budget):'Baki '+RM(budget-total)}</span></div></div>` : ''}
    <div class="summary">Bagi tempoh <b>${periodTxt}</b>${name?', <b>'+esc(name)+'</b>':''} telah membelanjakan sebanyak <b>${RM(total)}</b> melalui <b>${tx.length}</b> transaksi,
      dengan purata <b>${RM(avg)}</b> sehari. Kategori perbelanjaan utama ialah <b>${cat(topCat[0]).n}</b> (${(topCat[1].v/total*100).toFixed(0)}%).
      ${delta==null?'':`Perbelanjaan ${delta>0?'<b>meningkat</b>':'<b>menurun</b>'} sebanyak ${Math.abs(delta).toFixed(1)}% berbanding tempoh sebelumnya.`}
      ${budget?(total>budget?`Perbelanjaan telah <b>melebihi bajet</b> sebanyak ${RM(total-budget)}.`:`Perbelanjaan masih <b>dalam bajet</b>, dengan baki ${RM(budget-total)}.`):''}</div>
  </section>`;

  // 2. Trend harian
  h += `<section><h2><span class="n">2</span>Trend Perbelanjaan Harian</h2>${barChart(days, avg)}</section>`;

  // 3. Kategori
  h += `<section><h2><span class="n">3</span>Pecahan Mengikut Kategori</h2><div class="two">${donut(cats,total)}
    <table><thead><tr><th>Kategori</th><th class="c hide-sm">Bil.</th><th class="hide-sm" style="width:28%">Bahagian</th><th class="r">%</th><th class="r">Jumlah</th></tr></thead><tbody>
    ${cats.map(([k,x]) => `<tr><td><span class="dot" style="background:${cat(k).c}"></span>${cat(k).n}</td><td class="c hide-sm muted">${x.n}</td>
      <td class="hide-sm"><div class="mini"><i style="width:${x.v/cats[0][1].v*100}%;background:${cat(k).c}"></i></div></td>
      <td class="r muted">${(x.v/total*100).toFixed(1)}</td><td class="r">${fmt(x.v)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Jumlah</td><td class="c hide-sm">${tx.length}</td><td class="hide-sm"></td><td class="r">100</td><td class="r tot">${fmt(total)}</td></tr></tfoot></table></div></section>`;

  // 4. Top 5 + pemerhatian
  h += `<section><h2><span class="n">4</span>Perbelanjaan Terbesar & Pemerhatian</h2>
    <table class="top5"><thead><tr><th style="width:40px">#</th><th>Butiran</th><th class="hide-sm">Kategori</th><th>Tarikh</th><th class="r">Jumlah (RM)</th></tr></thead><tbody>
    ${top5.map((t,i)=>`<tr><td><span class="rank">${i+1}</span></td><td>${esc(t.desc)}</td><td class="hide-sm"><span class="cat-tag">${cat(t.cat).e} ${cat(t.cat).n}</span></td><td class="muted">${dshort(new Date(t.ts))}</td><td class="r"><b>${fmt(t.amount)}</b></td></tr>`).join('')}
    </tbody></table>
    <div class="notes" style="margin-top:14px">
      <div class="note"><i>📅</i><span>Hari belanja tertinggi: <b>${peak.d?dstr(peak.d):'—'}</b> (${RM(peak.v)}).</span></div>
      <div class="note"><i>🗓</i><span>Berbelanja pada <b>${activeDays}</b> daripada ${nDays} hari (${(activeDays/nDays*100).toFixed(0)}%).</span></div>
      <div class="note"><i>📊</i><span>Hari paling aktif: <b>${HARI[dow.indexOf(Math.max(...dow))]}</b>. Hujung minggu: ${(wkend/total*100).toFixed(0)}% daripada jumlah.</span></div>
      <div class="note"><i>💡</i><span>${budget && total>budget ? `Kurangkan <b>${cat(topCat[0]).n}</b> untuk kembali dalam bajet.` : `Purata setiap transaksi ialah <b>${RM(total/tx.length)}</b>.`}</span></div>
    </div></section>`;

  // 5. Senarai transaksi
  let rows = '', curDay = '';
  tx.forEach(t => { const d = new Date(t.ts), k = d.toDateString();
    if (k !== curDay){ curDay = k; const sub = tx.filter(x => new Date(x.ts).toDateString()===k).reduce((s,x)=>s+x.amount,0);
      rows += `<tr class="day-row"><td colspan="3">${HARI[d.getDay()]}, ${dstr(d)}</td><td class="r">${fmt(sub)}</td></tr>`; }
    rows += `<tr><td class="muted" style="width:60px">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</td><td>${esc(t.desc)}</td><td><span class="cat-tag">${cat(t.cat).e} <span class="hide-sm">${cat(t.cat).n}</span></span></td><td class="r">${fmt(t.amount)}</td></tr>`; });
  h += `<section class="long"><h2><span class="n">5</span>Senarai Transaksi Terperinci</h2>
    <table><thead><tr><th>Masa</th><th>Butiran</th><th>Kategori</th><th class="r">Jumlah (RM)</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td colspan="3">Jumlah Keseluruhan</td><td class="r tot">${fmt(total)}</td></tr></tfoot></table></section>`;

  // Pengesahan
  h += `<section><h2><span class="n">6</span>Pengesahan</h2>
    <p style="font-size:13px;color:var(--ink2);line-height:1.6;margin:0">Saya mengesahkan bahawa maklumat perbelanjaan dalam laporan ini adalah benar berdasarkan rekod peribadi saya.</p>
    <div class="sign"><div><span><b>${esc(name || '')}</b>Tandatangan</span></div><div><span><b>&nbsp;</b>Tarikh</span></div></div></section></div>`;
  h += footer(name, ref);
  $('#paper').innerHTML = h;
}
function startOf(d){ d = new Date(d); d.setHours(0,0,0,0); return d.getTime(); }
function footer(name, ref){ return `<div class="foot"><span>BELANJA · Laporan Perbelanjaan${name?' · '+esc(name):''}</span><span>${ref} · Sulit & Peribadi</span></div>`; }

function barChart(days, avg){
  const W = 720, H = 200, pL = 44, pR = 8, pT = 14, pB = 26;
  const max = niceMax(Math.max(...days.map(d=>d.v), avg, 1));
  const bw = (W-pL-pR)/days.length, barW = Math.max(2, Math.min(26, bw*.62));
  const y = v => pT + (H-pT-pB)*(1 - v/max);
  let g = `<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c860"/><stop offset="1" stop-color="#a8841f"/></linearGradient>
    <linearGradient id="bs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ccd3"/><stop offset="1" stop-color="#8b8f99"/></linearGradient></defs>`;
  for (let i=0;i<=4;i++){ const v = max*i/4, yy = y(v);
    g += `<line x1="${pL}" x2="${W-pR}" y1="${yy}" y2="${yy}" stroke="${i?'#efece4':'#16171c'}" stroke-width="${i?1:1.2}"/><text x="${pL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#9a9ea8">${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`; }
  const step = Math.ceil(days.length / 16);
  const peakV = Math.max(...days.map(d=>d.v));
  days.forEach((d,i) => { const cx = pL + bw*i + bw/2, top = y(d.v);
    if (d.v) g += `<rect x="${cx-barW/2}" y="${top}" width="${barW}" height="${H-pB-top}" rx="${Math.min(4,barW/2)}" fill="url(#${d.v===peakV?'bg':'bs'})"/>`;
    if (i % step === 0 || i === days.length-1) g += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6b6f7a">${days.length<=7?HARI[d.d.getDay()].slice(0,3):d.d.getDate()+(d.d.getDate()===1||i===0?' '+BULAN[d.d.getMonth()].slice(0,3):'')}</text>`; });
  const ya = y(avg);
  g += `<line x1="${pL}" x2="${W-pR}" y1="${ya}" y2="${ya}" stroke="#b8922a" stroke-dasharray="4 4"/><rect x="${pL+4}" y="${ya-17}" width="${RM(avg).length*5.6+16}" height="14" rx="7" fill="#fff" stroke="#e6d9ad"/><text x="${pL+12}" y="${ya-7}" font-size="10" font-weight="600" fill="#b8922a">Purata ${RM(avg)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Carta perbelanjaan harian">${g}</svg>
    <div style="display:flex;gap:18px;font-size:11px;color:#6b6f7a;margin-top:6px"><span><span class="dot" style="background:#d4af37"></span>Hari tertinggi</span><span><span class="dot" style="background:#b0b4bc"></span>Perbelanjaan harian</span><span>– – Purata sehari</span></div>`;
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function donut(cats, total){
  const R = 74, C = 2*Math.PI*R, cx = 100, cy = 100; let off = 0;
  let g = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#f0ede5" stroke-width="22"/>`;
  cats.forEach(([k,x]) => { const l = x.v/total*C, gap = cats.length>1?2:0;
    g += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${cat(k).c}" stroke-width="22" stroke-dasharray="${Math.max(0,l-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`; off += l; });
  g += `<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#6b6f7a">JUMLAH</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="18" font-weight="600" fill="#16171c">RM ${total>=10000?(total/1000).toFixed(1)+'k':fmt(total)}</text>`;
  return `<svg viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Carta kategori">${g}</svg>`;
}

$('#period').onchange = build;
$('#nm').oninput = () => { state.name = $('#nm').value.trim(); saveState(); build(); };
$('#print').onclick = () => window.print();
build();
})();
</script>
